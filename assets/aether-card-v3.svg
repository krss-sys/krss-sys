<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">aether-stream-layer</title>
  <desc id="d">Featured project, work in progress. aether-stream-layer is an AP-oriented, high-throughput message streaming layer in C++ built on POSIX sockets and a thread-safe queue. Implemented data flow: client, TCP server, ThreadPool, echo handler. Target design adds a queue and downstream processing. Design choices: length-prefixed frames, bounded frame size, blocking ThreadPool, plain POSIX and STL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#171236"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="ti" gradientUnits="userSpaceOnUse" x1="36" y1="0" x2="470" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;868 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <clipPath id="card"><rect width="900" height="430" rx="18"/></clipPath>
    <clipPath id="fill"><rect x="104" y="398" width="133" height="8" rx="4"/></clipPath>
    <path id="flow" d="M94 232 H521"/>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <rect width="900" height="430" fill="url(#bg)"/>
    <rect width="900" height="430" fill="url(#grid)"/>
    <circle cx="790" cy="90" r="150" fill="url(#orbC)"><animate attributeName="r" values="140;175;140" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="400" r="140" fill="url(#orbV)"><animate attributeName="r" values="130;165;130" dur="7s" begin="-2s" repeatCount="indefinite"/></circle>

    <g fill="#ffffff">
      <circle cx="610" cy="40" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="-0.6s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="92" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.1s" begin="-1.8s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="64" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="-0.3s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="120" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="-2.2s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="170" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.9s" begin="-1.1s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="120" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.4s" begin="-2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- badges -->
    <rect x="36" y="26" width="158" height="26" rx="13" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="52" cy="39" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="64" y="43" font-size="10.500" letter-spacing="1.200" fill="#67e8f9">FEATURED PROJECT</text>

    <rect x="712" y="26" width="152" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.45"/>
    <circle cx="728" cy="39" r="3.5" fill="#fbbf24"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="740" y="43" font-size="10.500" letter-spacing="1.200" fill="#fcd34d">WORK IN PROGRESS</text>

    <!-- title and description -->
    <text x="36" y="106" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="url(#ti)">aether-stream-layer</text>
    <text x="38" y="140" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#b6c2dc">An AP-oriented, high-throughput message streaming layer in C++,</text>
    <text x="38" y="164" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#b6c2dc">built on POSIX sockets and a thread-safe queue.</text>

    <!-- data flow -->
    <text x="40" y="196" font-size="11" fill="#6b7a99">// data flow</text>

    <g stroke-width="1.5" fill="none">
      <line x1="148" y1="232" x2="176" y2="232" stroke="#22d3ee" stroke-opacity="0.7" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1s" repeatCount="indefinite"/></line>
      <line x1="290" y1="232" x2="319" y2="232" stroke="#22d3ee" stroke-opacity="0.7" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1s" repeatCount="indefinite"/></line>
      <line x1="433" y1="232" x2="461" y2="232" stroke="#22d3ee" stroke-opacity="0.7" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1s" repeatCount="indefinite"/></line>
      <line x1="575" y1="232" x2="603" y2="232" stroke="#6b7a99" stroke-opacity="0.6" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="2.4s" repeatCount="indefinite"/></line>
      <line x1="718" y1="232" x2="746" y2="232" stroke="#6b7a99" stroke-opacity="0.6" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="2.4s" repeatCount="indefinite"/></line>
    </g>
    <g fill="#22d3ee" fill-opacity="0.85">
      <polygon points="175,227.500 182,232 175,236.500"/>
      <polygon points="318,227.500 325,232 318,236.500"/>
      <polygon points="460,227.500 467,232 460,236.500"/>
    </g>
    <g fill="#6b7a99" fill-opacity="0.7">
      <polygon points="603,227.500 610,232 603,236.500"/>
      <polygon points="745,227.500 752,232 745,236.500"/>
    </g>

    <!-- packets travel under the nodes, so they seem to pass through -->
    <circle r="3" fill="#a78bfa" fill-opacity="0.5"><animateMotion dur="3s" begin="0.36s" repeatCount="indefinite"><mpath xlink:href="#flow"/></animateMotion></circle>
    <circle r="3.5" fill="#22d3ee" fill-opacity="0.75"><animateMotion dur="3s" begin="0.18s" repeatCount="indefinite"><mpath xlink:href="#flow"/></animateMotion></circle>
    <circle r="5" fill="#e0fbff"><animateMotion dur="3s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#flow"/></animateMotion></circle>

    <!-- implemented nodes -->
    <rect x="40" y="208" width="108" height="48" rx="10" fill="#0d1326" stroke="#22d3ee" stroke-opacity="0.55"/>
    <rect x="182" y="208" width="108" height="48" rx="10" fill="#0d1326" stroke="#60a5fa" stroke-opacity="0.55"/>
    <rect x="325" y="208" width="108" height="48" rx="10" fill="#0d1326" stroke="#a78bfa" stroke-opacity="0.55"/>
    <rect x="467" y="208" width="108" height="48" rx="10" fill="#0d1326" stroke="#22d3ee" stroke-opacity="0.55"/>

    <rect x="40" y="208" width="108" height="48" rx="10" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0.28;0;0" keyTimes="0;0.1;0.35;1" dur="3s" begin="-0.25s" repeatCount="indefinite"/></rect>
    <rect x="182" y="208" width="108" height="48" rx="10" fill="#60a5fa" opacity="0"><animate attributeName="opacity" values="0;0.28;0;0" keyTimes="0;0.1;0.35;1" dur="3s" begin="0.75s" repeatCount="indefinite"/></rect>
    <rect x="325" y="208" width="108" height="48" rx="10" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0.28;0;0" keyTimes="0;0.1;0.35;1" dur="3s" begin="1.75s" repeatCount="indefinite"/></rect>
    <rect x="467" y="208" width="108" height="48" rx="10" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0.28;0;0" keyTimes="0;0.1;0.35;1" dur="3s" begin="2.75s" repeatCount="indefinite"/></rect>

    <g font-size="13" text-anchor="middle" fill="#e6edf3">
      <text x="94" y="237">Client</text>
      <text x="236" y="237">TCP server</text>
      <text x="379" y="237">ThreadPool</text>
      <text x="521" y="237">Echo handler</text>
    </g>

    <!-- target-design ghost nodes -->
    <rect x="610" y="208" width="108" height="48" rx="10" fill="none" stroke="#6b7a99" stroke-opacity="0.7" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="752" y="208" width="108" height="48" rx="10" fill="none" stroke="#6b7a99" stroke-opacity="0.7" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="3s" repeatCount="indefinite"/></rect>
    <g font-size="13" text-anchor="middle" fill="#7f8fb0">
      <text x="664" y="237">Queue</text>
      <text x="806" y="237">Downstream</text>
    </g>

    <!-- brackets -->
    <path d="M40 268 v6 H575 v-6" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="307" y="293" text-anchor="middle" font-size="11" fill="#22d3ee">implemented</text>
    <path d="M610 268 v6 H860 v-6" fill="none" stroke="#6b7a99" stroke-opacity="0.6" stroke-dasharray="3 3"/>
    <text x="735" y="293" text-anchor="middle" font-size="11" fill="#6b7a99">target design</text>

    <!-- design choices -->
    <text x="40" y="328" font-size="11" fill="#6b7a99">// design choices</text>
    <rect x="40" y="338" width="182" height="28" rx="8" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3.6s" repeatCount="indefinite"/></rect>
    <text x="131" y="356" text-anchor="middle" font-size="12" fill="#e6edf3">length-prefixed frames</text>
    <rect x="232" y="338" width="154" height="28" rx="8" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3.6s" begin="-0.9s" repeatCount="indefinite"/></rect>
    <text x="309" y="356" text-anchor="middle" font-size="12" fill="#e6edf3">bounded frame size</text>
    <rect x="396" y="338" width="161" height="28" rx="8" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/></rect>
    <text x="476.500" y="356" text-anchor="middle" font-size="12" fill="#e6edf3">blocking ThreadPool</text>
    <rect x="567" y="338" width="146" height="28" rx="8" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3.6s" begin="-2.7s" repeatCount="indefinite"/></rect>
    <text x="640" y="356" text-anchor="middle" font-size="12" fill="#e6edf3">plain POSIX + STL</text>

    <!-- button -->
    <rect x="744" y="338" width="120" height="28" rx="14" fill="url(#ac)"/>
    <text x="788" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0f1f">view repo</text>
    <path d="M832 352 h11 m-4 -4 l4 4 l-4 4" fill="none" stroke="#0a0f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="1.4s" repeatCount="indefinite"/>
    </path>

    <!-- progress -->
    <text x="40" y="406" font-size="11" fill="#6b7a99">progress</text>
    <rect x="104" y="398" width="400" height="8" rx="4" fill="#131a33"/>
    <rect x="104" y="398" width="133" height="8" rx="4" fill="url(#ac)"/>
    <g clip-path="url(#fill)">
      <rect x="64" y="398" width="40" height="8" fill="#ffffff" fill-opacity="0.4">
        <animate attributeName="x" values="64;237" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="520" y="406" font-size="11" fill="#9fb0cc">~1/3 of the road · building in the open</text>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="428.5" rx="17" fill="none" stroke="url(#ac)" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="898.5" height="428.5" rx="17" pathLength="1000" fill="none" stroke="url(#ac)" stroke-width="2.500" stroke-linecap="round" stroke-dasharray="70 930">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
