<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 344" role="img" aria-label="aether-stream-layer: an AP-oriented, high-throughput message streaming layer in C++ on top of POSIX sockets and a thread-safe queue. Data flow: client, TCP server, ThreadPool, echo handler. Design choices: length-prefixed frames, bounded frame size, blocking ThreadPool, plain POSIX and STL.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .core { fill: #161b22; stroke: #f34b7d; stroke-width: 1.5; }
    .t { fill: #e6edf3; font-size: 13px; font-weight: 600; }
    .s { fill: #8b949e; font-size: 11.5px; }
    .arrow { stroke: #8b949e; stroke-width: 1.5; fill: none; }
    .lab { fill: #8b949e; font-size: 12px; }
    .dot { fill: #f34b7d; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Card + terminal-style title bar (same look as the banner) -->
  <rect width="830" height="344" rx="12" fill="#0d1117"/>
  <path d="M0 40 V12 A12 12 0 0 1 12 0 H818 A12 12 0 0 1 830 12 V40 Z" fill="#161b22"/>
  <line x1="0" y1="40.5" x2="830" y2="40.5" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="829" height="343" rx="12" fill="none" stroke="#30363d"/>
  <circle cx="26" cy="20.5" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20.5" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20.5" r="6" fill="#27c93f"/>
  <text x="415" y="25" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">krss-sys/aether-stream-layer</text>

  <!-- Description (same wording as the repo description) -->
  <text x="28" y="76" class="sans" font-size="16" fill="#c9d1d9">An AP-oriented, high-throughput message streaming layer in C++</text>
  <text x="28" y="99" class="sans" font-size="16" fill="#c9d1d9">on top of POSIX sockets and a thread-safe queue.</text>

  <!-- Data flow: what the server does today -->
  <text x="28" y="128" class="mono lab"><tspan fill="#f34b7d">#</tspan> data flow</text>

  <rect x="27" y="140" width="176" height="64" rx="8" class="box"/>
  <text x="115" y="168" text-anchor="middle" class="sans t">Client</text>
  <text x="115" y="188" text-anchor="middle" class="sans s">length-prefixed frames</text>

  <rect x="227" y="140" width="176" height="64" rx="8" class="box"/>
  <text x="315" y="168" text-anchor="middle" class="sans t">TCP server</text>
  <text x="315" y="188" text-anchor="middle" class="sans s">accept loop</text>

  <rect x="427" y="140" width="176" height="64" rx="8" class="core"/>
  <text x="515" y="168" text-anchor="middle" class="sans t">ThreadPool</text>
  <text x="515" y="188" text-anchor="middle" class="sans s">1 worker per connection</text>

  <rect x="627" y="140" width="176" height="64" rx="8" class="box"/>
  <text x="715" y="168" text-anchor="middle" class="sans t">Echo handler</text>
  <text x="715" y="188" text-anchor="middle" class="sans s">decode frame, echo back</text>

  <path d="M207 172 H222" class="arrow" marker-end="url(#ah)"/>
  <path d="M407 172 H422" class="arrow" marker-end="url(#ah)"/>
  <path d="M607 172 H622" class="arrow" marker-end="url(#ah)"/>

  <!-- Design choices (all present in the code) -->
  <text x="28" y="236" class="mono lab"><tspan fill="#f34b7d">#</tspan> design choices</text>

  <rect x="27" y="248" width="186" height="76" rx="8" class="box"/>
  <circle cx="43" cy="271" r="3.5" class="dot"/>
  <text x="55" y="276" class="sans t">Length-prefixed</text>
  <text x="55" y="296" class="sans s">Clear message boundaries</text>
  <text x="55" y="312" class="sans s">over raw TCP</text>

  <rect x="223" y="248" width="186" height="76" rx="8" class="box"/>
  <circle cx="239" cy="271" r="3.5" class="dot"/>
  <text x="251" y="276" class="sans t">Bounded frames</text>
  <text x="251" y="296" class="sans s">1 MiB cap, checked</text>
  <text x="251" y="312" class="sans s">before allocating</text>

  <rect x="419" y="248" width="186" height="76" rx="8" class="box"/>
  <circle cx="435" cy="271" r="3.5" class="dot"/>
  <text x="447" y="276" class="sans t">Blocking ThreadPool</text>
  <text x="447" y="296" class="sans s">Fixed workers, so max</text>
  <text x="447" y="312" class="sans s">clients = worker count</text>

  <rect x="615" y="248" width="186" height="76" rx="8" class="box"/>
  <circle cx="631" cy="271" r="3.5" class="dot"/>
  <text x="643" y="276" class="sans t">Plain POSIX + STL</text>
  <text x="643" y="296" class="sans s">No frameworks, every</text>
  <text x="643" y="312" class="sans s">layer stays visible</text>
</svg>
