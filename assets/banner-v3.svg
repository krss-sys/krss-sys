      <circle cx="122" cy="54" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="214" cy="24" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" begin="-0.9s" repeatCount="indefinite"/></circle>
