      <circle cx="684" cy="14" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" begin="-0.7s" repeatCount="indefinite"/></circle>
      <circle cx="868" cy="36" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="-1.8s" repeatCount="indefinite"/></circle>
