<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="bt bd">
  <title id="bt">Kross (krss-sys)</title>
  <desc id="bd">Animated banner. Kross, Systems Software Engineer in the making, C++ and Linux. Systems software, close to the metal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#171236"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ti" gradientUnits="userSpaceOnUse" x1="58" y1="0" x2="300" y2="0" spreadMethod="reflect">
