    <text x="60" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#6b7a99">~/krss-sys <tspan fill="#22d3ee">$</tspan> whoami</text>
    <text x="58" y="152" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#ti)">Kross</text>

    <text x="60" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#cfe9f5" textLength="540" lengthAdjust="spacingAndGlyphs" clip-path="url(#type)">Systems Software Engineer in the making | C++ &amp; Linux</text>
    <rect x="58" y="173" width="9" height="22" rx="1" fill="#22d3ee">
      <animate attributeName="x" values="58;602;602;58" keyTimes="0;0.4;0.92;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <text x="60" y="226" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" fill-opacity="0.9">Systems software, close to the metal.</text>
    <text x="60" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#7f8fb0" textLength="500" lengthAdjust="spacingAndGlyphs">low-level systems  ·  high-performance computing  ·  distributed systems</text>

    <rect x="-260" y="-20" width="220" height="340" fill="url(#sh)" transform="skewX(-18)">
      <animate attributeName="x" values="-260;1100" dur="8s" repeatCount="indefinite"/>
