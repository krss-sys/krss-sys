<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 230" role="img" aria-label="Krss. Systems software, close to the metal.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .a { animation: fade .7s ease-out both; }
    .d1 { animation-delay: .2s; }
    .d2 { animation-delay: .6s; }
    .d3 { animation-delay: 1s; }
    .d4 { animation-delay: 1.3s; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { fill: #f34b7d; } 50%, 100% { fill: transparent; } }
    @media (prefers-reduced-motion: reduce) { .a, .cur { animation: none; } }
  </style>

  <rect width="830" height="230" rx="12" fill="#0d1117"/>
  <path d="M0 40 V12 A12 12 0 0 1 12 0 H818 A12 12 0 0 1 830 12 V40 Z" fill="#161b22"/>
  <line x1="0" y1="40.5" x2="830" y2="40.5" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="829" height="229" rx="12" fill="none" stroke="#30363d"/>

  <circle cx="26" cy="20.5" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20.5" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20.5" r="6" fill="#27c93f"/>
  <text x="415" y="25" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">krss@sys: ~</text>

  <text x="32" y="84" class="mono a d1" font-size="15"><tspan fill="#f34b7d">$</tspan><tspan fill="#8b949e"> whoami</tspan></text>

  <text x="32" y="138" class="mono a d2" font-size="46" font-weight="700" fill="#e6edf3">Krss<tspan class="cur" dx="8">▌</tspan></text>

  <text x="32" y="176" class="sans a d3" font-size="19" fill="#c9d1d9">Systems software, close to the metal.</text>

  <text x="32" y="206" class="mono a d4" font-size="14" fill="#8b949e">Low-level systems  ·  High-performance computing  ·  Distributed systems</text>
</svg>
