      <circle cx="240" cy="38" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.100s" begin="-1.700s" repeatCount="indefinite"/></circle>
      <circle cx="388" cy="16" r="1.300"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.900s" begin="-0.9s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="30" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.700s" begin="-2.300s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="18" r="1.200"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.100s" begin="-1.300s" repeatCount="indefinite"/></circle>
