    <text x="450" y="52" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf3">Learning in public, one commit at a time.</text>
    <text x="450" y="74" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#7f8fb0">krss-sys  ·  C++ &amp; Linux</text>

    <use xlink:href="#w1" fill="none" stroke="url(#ac)" stroke-opacity="0.45" stroke-width="1.500" stroke-dasharray="3 7"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.200s" repeatCount="indefinite"/></use>
    <use xlink:href="#w2" fill="none" stroke="url(#ac)" stroke-opacity="0.25" stroke-width="1.200" stroke-dasharray="2 8"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.800s" repeatCount="indefinite"/></use>
    <circle r="3.200" fill="#22d3ee"><animateMotion dur="7s" begin="-1s" repeatCount="indefinite"><mpath xlink:href="#w1"/></animateMotion></circle>
    <circle r="3.200" fill="#a78bfa"><animateMotion dur="7s" begin="-3.300s" repeatCount="indefinite"><mpath xlink:href="#w1"/></animateMotion></circle>
