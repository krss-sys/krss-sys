<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="120" viewBox="0 0 900 120" role="img" aria-labelledby="t">
  <title id="t">Learning in public, one commit at a time.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#171236"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <clipPath id="card"><rect width="900" height="120" rx="18"/></clipPath>
    <path id="w1" d="M-20 100 C 110 84, 230 112, 370 98 S 620 82, 760 100 S 880 110, 930 96"/>
    <path id="w2" d="M-20 110 C 140 98, 260 116, 420 106 S 700 96, 940 112"/>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="120" fill="url(#bg)"/>
    <g fill="#ffffff">
