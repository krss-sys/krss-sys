  <!-- accepted check icon -->
  <circle cx="252" cy="37" r="17" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.6"/>
  <circle cx="252" cy="37" r="17" fill="none" stroke="#34d399"><animate attributeName="r" values="17;27" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0;0" keyTimes="0;0.2;0.5;1" dur="4s" repeatCount="indefinite"/></circle>
  <path d="M243 37 l7 7 l13 -14" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="40">
    <animate attributeName="stroke-dashoffset" values="40;0;0;40" keyTimes="0;0.2;0.85;1" dur="4s" repeatCount="indefinite"/>
