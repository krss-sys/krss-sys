<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 300" role="img" aria-label="Toolbox: C++20; CMake and GCC/G++; POSIX sockets, TCP, length-prefixed framing; std::thread, std::mutex, std::condition_variable; GoogleTest, ThreadSanitizer, UBSan; strace">
  <style>
